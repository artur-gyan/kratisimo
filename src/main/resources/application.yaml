spring:
  application:
    name: kratisimo

  datasource:
    url: jdbc:postgresql://localhost:5432/kratisimo_db
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate       # Flyway χτίζει το σχήμα· ο Hibernate ΜΟΝΟ επαληθεύει (fail-fast στο boot)
    show-sql: true
    properties:
      hibernate:
        format_sql: true       # ίδιο με πριν (D-όχι, απλώς για ευανάγνωστα logs)
    open-in-view: false        # D22 — μην το χάσεις, ήταν στο αρχικό yaml σου

  flyway:
    enabled: true              # ρητά ON — το Flyway τρέχει τα migrations στο startup
    baseline-on-migrate: false # καθαρή βάση, τα πάντα από V1 (Δρόμος Β)
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: ${MAIL_USERNAME}      # env variable — καμία τιμή committed (D58)
    password: ${MAIL_PASSWORD}      # env variable — ΠΟΤΕ committed
    properties:
      mail:
        smtp:
          auth: true                # ο server απαιτεί username/password
          starttls:
            enable: true            # κρυπτογράφηση της σύνδεσης (STARTTLS)
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

server:
  port: 8080