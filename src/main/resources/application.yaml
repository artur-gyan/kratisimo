spring:
  application:
    name: kratisimo

  datasource:
    url: jdbc:postgresql://localhost:5432/kratisimo_db
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000


server:
  port: 8080